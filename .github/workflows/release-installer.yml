name: Release - Windows, Linux and macOS

# Runs every time a pull request is MERGED into the `release` branch.
# Builds, in parallel:
#   - Windows: a self-contained win-x64 publish packed with Inno Setup   -> GameDock-Setup-<version>.exe
#   - Linux:   self-contained linux-x64 / linux-arm64 folders            -> GameDock-<version>-linux-<arch>.tar.gz
#   - macOS:   self-contained osx-arm64 / osx-x64 "App Launcher.app"     -> GameDock-<version>-osx-<arch>.zip
# and publishes one GitHub Release (shown in the "Releases" panel of the repo page) with all of them attached.
# Nothing is built until the unit tests (GameDock.Tests) pass on Windows, Linux and macOS, for merges and
# manual runs alike.
# The newest run is marked as "Latest", which is also what App Launcher's updater reads via /releases/latest
# (the installer on Windows, the archive for the machine's runtime on Linux / macOS).
on:
  pull_request:
    types: [closed]
    branches: [release]
  workflow_dispatch: # manual re-run from the Actions tab

permissions:
  contents: write # needed to create tags and releases

concurrency:
  group: release-installer
  cancel-in-progress: false

env:
  PROJECT: GameDock/GameDock/GameDock.csproj
  SOLUTION: GameDock/GameDock.sln
  CONFIGURATION: Release
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    # Skip PRs that were closed without merging.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Platform-specific code paths (installers, folders, asset patterns): every OS must pass.
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: >
          dotnet test ${{ env.SOLUTION }}
          -c ${{ env.CONFIGURATION }}
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  version:
    # Builds start only after every test job passed.
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Compute version
        id: version
        shell: bash
        run: |
          # Major.Minor from <VersionPrefix>, the run number as the patch part.
          base=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' "$PROJECT" || true)
          base=${base:-0.1}
          IFS=. read -r major minor _ <<< "$base"
          version="$major.${minor:-0}.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "commit=${{ github.event.pull_request.merge_commit_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build-windows:
    needs: version
    runs-on: windows-latest
    env:
      RUNTIME: win-x64

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # No separate `dotnet restore` + `--no-restore`: a standalone restore doesn't see --self-contained / -c,
      # so the runtime pack ReadyToRun needs is never restored (NETSDK1094). Publish restores with the exact
      # same properties it builds with, like the Linux and macOS scripts.
      - name: Publish (self-contained, ReadyToRun)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:Version=${{ needs.version.outputs.version }}
          -p:DebugType=none
          -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            installer\GameDock.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDock-${{ needs.version.outputs.version }}-windows
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build package
        run: bash packaging/build-linux.sh ${{ matrix.rid }} ${{ needs.version.outputs.version }} dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDock-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build app bundle
        run: bash packaging/build-macos.sh ${{ matrix.rid }} ${{ needs.version.outputs.version }} dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDock-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: GameDock-${{ needs.version.outputs.version }}-*
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: App Launcher ${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.commit }}
          body: |
            Built from ${{ github.event.pull_request.html_url || github.sha }}
            ${{ github.event.pull_request.title }}

            | Platform | Download |
            |---|---|
            | Windows (x64) | `GameDock-Setup-${{ needs.version.outputs.version }}.exe` |
            | Linux (x64 / arm64) | `GameDock-${{ needs.version.outputs.version }}-linux-<arch>.tar.gz`, unpack and run `GameDock/install.sh` |
            | macOS (Apple silicon / Intel) | `GameDock-${{ needs.version.outputs.version }}-osx-<arch>.zip`, move `App Launcher.app` to Applications |
          generate_release_notes: true
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
